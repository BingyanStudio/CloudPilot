openapi: 3.1.0
info:
  title: CloudPilot API
  version: 0.1.0
  description: Declarative Agent scheduling and observability control plane. All /api routes except login require
    a session cookie. Browser mutations require Origin to match Host; CLI requests may omit Origin. JSON bodies
    are limited to 2 MiB unless a smaller route-specific limit applies. Errors return {message}. Users have one
    role. Viewer reads everything; editor additionally changes resources, imports configuration and drives
    events and runs; admin additionally manages users and SSO settings. Insufficient roles receive 403.
servers:
- url: http://localhost:8080
  description: Local development
security:
- sessionCookie: []
paths:
  /health:
    get:
      summary: Check database health
      tags:
      - Health
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - status
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
      security: []
  /api/auth/login:
    post:
      summary: Create a 24-hour session with a local password
      tags:
      - Authentication
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      security: []
      description: Sets an HttpOnly SameSite=Strict cp_session cookie. Maximum 10 login attempts per client IP per
        minute. Secure flag follows server configuration.
  /api/auth/me:
    get:
      summary: Read the current user
      tags:
      - Authentication
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/auth/logout:
    post:
      summary: Invalidate the current session
      tags:
      - Authentication
      responses:
        '204':
          description: Session invalidated and cookie removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/overview:
    get:
      summary: Count persisted resources, events and runs
      tags:
      - Observability
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
      description: Resources are grouped by kind; events and runs by status. Groups with zero rows may be absent.
  /api/resources:
    get:
      summary: List declarative resources
      tags:
      - Resources
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - Input
          - Pipeline
          - Worker
          - Workspace
          - Runner
    post:
      summary: Create or replace a resource
      tags:
      - Resources
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Document'
      description: Upsert by kind and metadata.name. Applies defaults and validates all resource references. Include
        metadata.generation to reject stale edits. Worker spec.apiKey and Runner spec.e2b.apiKey are write-only;
        nonempty values replace the encrypted database credential; omission or an empty string preserves an existing
        credential unless apiKeySecretRef explicitly selects a legacy environment variable. A new Worker or E2B Runner
        requires apiKey or a legacy apiKeySecretRef. Input spec.secret and spec.github.token follow the same rules,
        with secretRef and github.tokenSecretRef as legacy alternatives. New Inputs require a webhook secret and
        github_issue Inputs also require a GitHub token. Legacy references and Workspace secretEnv values must not
        name CLOUDPILOT_* variables. Changing an E2B Runner's provider, domain or apiUrl requires re-entering apiKey.
        API responses never return plaintext or encrypted credentials.
  /api/resources/{kind}/{name}:
    parameters:
    - $ref: '#/components/parameters/Kind'
    - $ref: '#/components/parameters/Name'
    get:
      summary: Get a resource
      tags:
      - Resources
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Create or replace the named resource
      tags:
      - Resources
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Document'
      description: Body kind and metadata.name must match the path. Same validation and upsert behavior as POST
        /api/resources.
    delete:
      summary: Delete an unreferenced resource
      tags:
      - Resources
      responses:
        '204':
          description: Resource deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'
      description: References from other resources block deletion. Pipelines with queued or running events cannot
        be deleted.
  /api/config/import:
    post:
      summary: Atomically apply multi-document YAML
      tags:
      - Resources
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      description: Maximum 100 documents and 1 MiB YAML. Strict unknown-field validation. References can resolve
        to objects in this batch or already stored. Absent resources are not deleted. Credentials follow the same
        write-only encryption and preservation rules as POST /api/resources.
  /api/config/export:
    get:
      summary: Export all resources as portable YAML
      tags:
      - Resources
      responses:
        '200':
          description: Success
          content:
            application/yaml:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
      description: Returns an attachment named cloudpilot-resources.yaml. Omits API keys, Input secrets, GitHub tokens, their ciphertext and
        metadata.generation; legacy environment references remain. Reimporting into the same database preserves stored
        credentials. Importing into a new database requires supplying credential values again.
  /hooks/{name}:
    parameters:
    - $ref: '#/components/parameters/Name'
    post:
      summary: Queue a feedback event
      tags:
      - Inputs
      responses:
        '200':
          description: GitHub ping acknowledged or delivery ignored because its event, action, repository or issue does not match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookAcknowledgement'
        '202':
          description: Persisted event, or the original event for an existing idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
      parameters:
      - name: Idempotency-Key
        in: header
        schema:
          type: string
          maxLength: 190
        description: Optional key for webhook Inputs, scoped to this Input. Reusing it returns the original event
          without requeueing. GitHub issue Inputs use repository and issue identity instead.
      - name: X-GitHub-Event
        in: header
        schema:
          type: string
        description: GitHub event name. GitHub issue Inputs process issues deliveries and acknowledge other event
          types, including ping, without queueing a task.
      - name: X-GitHub-Delivery
        in: header
        schema:
          type: string
        description: Optional GitHub delivery identifier, retained in the agent context. It does not control deduplication.
      description: |
        Bodies are limited to 1 MiB. Authentication depends on Input.spec.type. webhook Inputs accept any valid
        JSON value and require a Bearer credential decrypted from Input.spec.secret (or legacy secretRef). github_issue Inputs require
        X-Hub-Signature-256, the sha256= prefixed hex HMAC of the unmodified body using that secret.

        GitHub issue Inputs accept open issues from the configured repository for opened, reopened, assigned and
        labeled actions. Any configured assignee or label match qualifies; pull requests and unmatched deliveries
        are acknowledged without creating an event. One event is persisted per Input and repository/issue identity,
        even when a new delivery ID is used. A duplicate returns the original event without requeueing.

        Matching deliveries require server.public_url and the configured GitHub token. The event payload preserves
        the GitHub issue and repository context and adds source: github_issue. A durable background notification
        replies to the issue with a WebUI link to /#/events/{id}; delivery failures retry independently of execution.
        Paused Inputs reject deliveries with 409; unavailable credentials or public URL return 503.
      security:
      - webhookBearer: []
      - githubSignature: []
  /api/events:
    get:
      summary: List the newest 200 events
      tags:
      - Events
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/PipelineFilter'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - queued
          - waiting
          - running
          - succeeded
          - failed
          - cancelled
          - interrupted
  /api/events/{id}:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      summary: Read an event and its execution attempts
      tags:
      - Events
      description: Returns the event even before its first run starts and all associated runs in descending ID
        order. This lookup is independent of the 200-event list limit and backs the WebUI task link /#/events/{id}.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/events/{id}/retry:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      summary: Start a fresh run for a failed, cancelled or interrupted event
      tags:
      - Events
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
      description: Starts a fresh Run with a reset retry budget. It does not continue an existing conversation.
        Interactive sessions must be closed before retrying a failed, cancelled or interrupted event. Previous run
        records and collected artifacts remain available.
  /api/pipelines/{name}/trigger:
    parameters:
    - $ref: '#/components/parameters/Name'
    post:
      summary: Release the current pipeline queue
      tags:
      - Events
      responses:
        '202':
          description: Pipeline trigger accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
      description: Releases events queued up to this trigger time while respecting concurrency. A paused pipeline
        cannot be triggered.
  /api/runs:
    get:
      summary: List the newest 200 runs
      tags:
      - Observability
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Run'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/PipelineFilter'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
          - interrupted
  /api/runs/{id}:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      summary: Get a run, session, capabilities, turns and artifacts
      tags:
      - Observability
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
      description: Legacy batch executions return session=null, an empty turns array, and false interactive capabilities.
  /api/runs/{id}/timeline:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      summary: Poll structured conversation and tool events
      tags:
      - Agent sessions
      parameters:
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Return event IDs greater than this cursor.
      responses:
        '200':
          description: At most 1000 events ordered by ascending ID.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
      description: Poll again using the last received ID. Timeline events are append-only and distinct from raw
        stdout/stderr logs. A legacy batch run returns an empty array.
  /api/runs/{id}/messages:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      summary: Send additional information to the agent
      tags:
      - Agent sessions
      description: An active turn receives a steering request. An idle, interrupted or failed resumable session
        queues another turn. HTTP 202 does not guarantee that the model has consumed a message; observe control
        acknowledgement and turn state.
      responses:
        '202':
          description: Operation accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentMessageRequest'
  /api/runs/{id}/interrupt:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      summary: Interrupt the current turn and keep its session
      tags:
      - Agent sessions
      description: Requests an agent-level interruption. The workspace and conversation remain available for continuation.
        A completed or inactive turn cannot be interrupted.
      responses:
        '202':
          description: Operation accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /api/runs/{id}/resume:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      summary: Queue another turn in the same session
      tags:
      - Agent sessions
      description: Continues the preserved conversation and workspace using the supplied instruction or the default
        continuation instruction. The new turn bypasses cron gating but respects the current pipeline pause and
        concurrency limits. It does not replay a prior tool process.
      responses:
        '202':
          description: Operation accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentResumeRequest'
  /api/runs/{id}/close:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      summary: End the session and remove its retained workspace
      tags:
      - Agent sessions
      description: Stops active work and removes the session runtime storage. Conversation timeline, logs and previously
        collected artifacts remain in CloudPilot. Cleanup failures remain visible and retryable; this does not undo
        external changes such as created Issues or PRs.
      responses:
        '202':
          description: Operation accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /api/runs/{id}/logs:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      summary: Poll execution logs incrementally
      tags:
      - Observability
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Only return log IDs greater than this cursor.
      description: Returns at most 1000 rows ordered by ascending ID. Poll again with the final returned ID to continue.
  /api/runs/{id}/cancel:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      summary: Cancel an active run
      tags:
      - Observability
      responses:
        '204':
          description: Cancellation accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
      description: Legacy cancellation endpoint. For interactive runs this ends the session rather than preserving
        it for continuation. Use /interrupt to stop only the current turn.
  /api/artifacts:
    get:
      summary: List the newest 200 artifacts
      tags:
      - Artifacts
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Artifact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/artifacts/{id}/download:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      summary: Download a collected file
      tags:
      - Artifacts
      responses:
        '200':
          description: Success
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
      description: Only file artifacts have downloads. Files are served as attachments with nosniff; internal filesystem
        paths are not exposed.
  /api/auth/oidc:
    get:
      summary: Report whether SSO login is enabled
      tags:
      - Authentication
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                required:
                - enabled
  /api/auth/oidc/login:
    get:
      summary: Start OIDC login
      tags:
      - Authentication
      security: []
      description: Redirects to the identity provider using state, nonce and PKCE stored in a 10-minute HttpOnly
        cp_oidc cookie. Failures redirect to /?sso_error=<message>.
      responses:
        '302':
          description: Redirect to the identity provider or back to the console with sso_error.
  /api/auth/oidc/callback:
    get:
      summary: Complete OIDC login
      tags:
      - Authentication
      security: []
      description: Verifies state, exchanges the code, verifies the ID token and nonce, then sets cp_session. The
        first login of an issuer/subject creates a user with the configured default role; SSO never links to an
        existing local account.
      parameters:
      - name: code
        in: query
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      - name: error
        in: query
        schema:
          type: string
      responses:
        '302':
          description: Redirect to / on success, or /?sso_error=<message> on failure.
  /api/users:
    get:
      summary: List users
      tags:
      - Users
      description: Admin only.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create a local user
      tags:
      - Users
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/users/{id}:
    parameters:
    - $ref: '#/components/parameters/ID'
    patch:
      summary: Change a user's role or reset a local password
      tags:
      - Users
      description: Admin only. Admins cannot change their own role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Delete a user and revoke their sessions
      tags:
      - Users
      description: Admin only. Admins cannot delete themselves.
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/settings/oidc:
    get:
      summary: Read SSO settings
      tags:
      - Users
      description: Admin only. The client secret is never returned.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCSettings'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      summary: Save SSO settings
      tags:
      - Users
      description: Admin only. When enabled, the discovery document is fetched and validated before saving.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OIDCSettings'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cp_session
    webhookBearer:
      type: http
      scheme: bearer
      description: Secret stored encrypted in Input.spec.secret, or resolved from the legacy secretRef environment variable.
    githubSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: For github_issue Inputs only. sha256= followed by the hexadecimal HMAC-SHA256 of the raw request
        body, signed with the Input secret credential. A Bearer token is not accepted for this Input type.
  parameters:
    Kind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum:
        - Input
        - Pipeline
        - Worker
        - Workspace
        - Runner
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
        maxLength: 63
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PipelineFilter:
      name: pipeline
      in: query
      schema:
        type: string
      description: Filter by pipeline name.
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid input or configuration
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Cross-origin mutation rejected or role lacks permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource or file not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource conflict or invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Database, scheduler or configured secret unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Webhook payload exceeds 1 MiB
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: 'Too many login attempts; Retry-After: 60'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          schema:
            type: string
            example: '60'
          description: Seconds before retrying.
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    Identity:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        sso:
          type: boolean
          description: Account was provisioned by OIDC login and has no local password.
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - username
      - role
      - sso
    Role:
      type: string
      enum:
      - admin
      - editor
      - viewer
    UserCreate:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 190
        password:
          type: string
          description: 12–72 bytes.
        role:
          $ref: '#/components/schemas/Role'
      required:
      - username
      - password
      - role
    UserUpdate:
      type: object
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/Role'
        password:
          type: string
          description: 12–72 bytes; local accounts only. Revokes the user's sessions.
    OIDCSettings:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        discoveryUrl:
          type: string
          description: Issuer URL or full /.well-known/openid-configuration URL.
        clientId:
          type: string
        clientSecret:
          type: string
          writeOnly: true
          description: Stored encrypted. Omit or leave empty to keep the stored secret.
        hasClientSecret:
          type: boolean
          readOnly: true
        scopes:
          type: string
          description: Space-separated; openid is always included.
        defaultRole:
          $ref: '#/components/schemas/Role'
        redirectUrl:
          type: string
          readOnly: true
          description: Callback URL to register with the identity provider.
      required:
      - enabled
      - discoveryUrl
      - clientId
      - scopes
      - defaultRole
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      required:
      - username
      - password
      additionalProperties: false
    Metadata:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          maxLength: 63
        generation:
          type: integer
          minimum: 0
          description: Optional optimistic concurrency token. A nonzero stale generation returns 409. YAML export
            omits it for portability.
      required:
      - name
      additionalProperties: false
    InputSpec:
      type: object
      properties:
        type:
          type: string
          enum:
          - webhook
          - github_issue
          default: webhook
        pipelineRef:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          maxLength: 63
        secret:
          type: string
          format: password
          writeOnly: true
          maxLength: 4096
          description: Webhook Bearer credential or GitHub HMAC signing secret. Required on creation unless a
            legacy secretRef is supplied. Encrypted at rest and omitted from reads and exports. Omit or send an empty
            string on update to preserve the stored value; a nonempty value replaces it and clears secretRef.
        secretRef:
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          deprecated: true
          description: Legacy server environment variable (not CLOUDPILOT_*) containing the webhook secret. Explicitly setting this
            reference without a new secret switches back to the environment credential.
        github:
          anyOf:
          - $ref: '#/components/schemas/GitHubInputSpec'
          - type: 'null'
        paused:
          type: boolean
          default: false
      required:
      - pipelineRef
      additionalProperties: false
      allOf:
      - if:
          properties:
            type:
              const: github_issue
          required:
          - type
        then:
          required:
          - github
          properties:
            github:
              type: object
        else:
          properties:
            github:
              type: 'null'
    GitHubInputSpec:
      type: object
      description: GitHub.com issue source. At least one assignee or label must be configured. A match in either
        list qualifies; names are matched case-insensitively.
      properties:
        repository:
          type: string
          pattern: '^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?/(?!\.{1,2}$)[A-Za-z0-9_.-]{1,100}$'
          description: GitHub repository owner/name. Deliveries for other repositories are ignored.
          example: your-org/your-app
        token:
          type: string
          format: password
          writeOnly: true
          maxLength: 4096
          description: GitHub token with repository Issues read/write permission, used for acknowledgement comments.
            Required on creation unless a legacy tokenSecretRef is supplied. Encrypted at rest and omitted from reads
            and exports. Omit or send an empty string to preserve the stored token. Not passed to the agent.
        tokenSecretRef:
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          deprecated: true
          description: Legacy server environment variable (not CLOUDPILOT_*) containing the GitHub token. Explicitly setting this
            reference without a new token switches back to the environment credential.
        assignees:
          type:
          - array
          - 'null'
          items:
            type: string
            pattern: '^(?:\*|[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?)$'
          description: Match any listed GitHub login. A literal '*' matches any issue with at least one assignee.
        labels:
          type:
          - array
          - 'null'
          items:
            type: string
            minLength: 1
            maxLength: 50
            pattern: '^(?=.*\S)[^\r\n]+$'
          description: Match any listed label name. Labels must be nonblank, single-line names of at most 50 characters
            and may contain spaces.
      required:
      - repository
      additionalProperties: false
      anyOf:
      - required:
        - assignees
        properties:
          assignees:
            type: array
            minItems: 1
      - required:
        - labels
        properties:
          labels:
            type: array
            minItems: 1
    HookAcknowledgement:
      type: object
      properties:
        status:
          type: string
          enum:
          - ignored
      required:
      - status
    PipelineSpec:
      type: object
      properties:
        workerRef:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          maxLength: 63
        workspaceRef:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          maxLength: 63
        runnerRef:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          maxLength: 63
        schedule:
          type: string
          default: ''
          description: Five-field cron; empty means immediate scheduling. Set timezone separately.
        timezone:
          type: string
          default: Asia/Shanghai
          example: Asia/Shanghai
        concurrency:
          type: integer
          minimum: 1
          maximum: 32
          default: 1
          description: Maximum concurrent executions, including human follow-up turns. Idle or interrupted sessions
            do not occupy a slot.
        paused:
          type: boolean
          default: false
          description: Blocks new batch and follow-up dispatch without interrupting active turns or active-turn
            steering.
        maxRetries:
          type: integer
          minimum: 0
          maximum: 10
          default: 0
          description: Automatic retries for batch execution and initial interactive failures before a provider
            thread exists, after session cleanup succeeds. Established conversations and human follow-up turns are
            not automatically replayed.
        timeoutSeconds:
          type: integer
          minimum: 10
          maximum: 86400
          default: 3600
          description: Execution timeout; applied independently to each interactive turn using the session configuration
            snapshot.
      required:
      - workerRef
      - workspaceRef
      - runnerRef
      additionalProperties: false
    WorkerSpec:
      type: object
      properties:
        type:
          type: string
          enum:
          - codex
          default: codex
        model:
          type: string
          minLength: 1
        endpoint:
          type: string
          description: Optional absolute HTTP(S) API base URL without embedded credentials.
        apiKey:
          type: string
          format: password
          writeOnly: true
          maxLength: 4096
          description: Model API key, encrypted at rest. Must be a nonblank single line of at most 4096 bytes.
            Omit or send an empty string on update to preserve the stored key. A nonempty value replaces it and
            removes apiKeySecretRef. Never returned in resource responses or YAML exports.
        apiKeySecretRef:
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          deprecated: true
          description: Legacy server environment variable (not CLOUDPILOT_*) containing the API key; optional when apiKey is supplied.
        instructions:
          type: string
      required:
      - model
      additionalProperties: false
    Repository:
      type: object
      properties:
        url:
          type: string
          description: HTTPS or SSH clone URL without embedded passwords.
        ref:
          type: string
          description: Optional branch, tag or commit reference.
        path:
          type: string
          description: Non-overlapping relative workspace path; defaults to repo-N.
      required:
      - url
      additionalProperties: false
    MCPServer:
      type: object
      properties:
        command:
          type: string
        args:
          type:
          - array
          - 'null'
          items:
            type: string
        env:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        url:
          type: string
          description: HTTP(S) MCP endpoint.
      additionalProperties: false
      description: Exactly one of command or url must be nonempty.
    WorkspaceSpec:
      type: object
      properties:
        repositories:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Repository'
        prompt:
          type: string
        tools:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Shell setup commands executed in order inside the worker.
        mcpServers:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/MCPServer'
        env:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        secretEnv:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
            pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          description: Maps container environment names to server environment secret names.
      additionalProperties: false
    RunnerSpec:
      oneOf:
      - $ref: '#/components/schemas/DockerRunnerSpec'
      - $ref: '#/components/schemas/E2BRunnerSpec'
    DockerRunnerSpec:
      type: object
      properties:
        type:
          type: string
          enum:
          - docker
          default: docker
        image:
          type: string
          default: cloudpilot-codex:latest
        network:
          type: string
          description: Docker network, e.g. bridge or a preconfigured isolated network.
        memory:
          type: string
          example: 4g
        cpus:
          type: string
          example: '2'
      additionalProperties: false
    E2BRunnerSpec:
      type: object
      properties:
        type:
          type: string
          const: e2b
        e2b:
          $ref: '#/components/schemas/E2BRunnerOptions'
      required:
      - type
      - e2b
      additionalProperties: false
    E2BRunnerOptions:
      type: object
      properties:
        provider:
          type: string
          enum:
          - e2b
          - novita
          default: e2b
        domain:
          type: string
          maxLength: 253
          description: Sandbox DNS hostname without scheme, port or path. Defaults to e2b.app for e2b and
            us-phx-1.sandbox.novita.ai for novita.
        apiUrl:
          type: string
          description: Optional absolute HTTP(S) management API base URL override without embedded credentials,
            query or fragment. Leave empty to use the provider default.
        apiKey:
          type: string
          format: password
          writeOnly: true
          maxLength: 4096
          description: Sandbox provider API key, encrypted at rest. Must be a nonblank single line of at most
            4096 bytes. Omit or send an empty string on update to preserve the stored key. A nonempty value replaces
            it and removes apiKeySecretRef. Never returned or injected into the sandbox as a task credential.
            Must be re-entered when provider, domain or apiUrl changes so a stored key is never sent to a new host.
        apiKeySecretRef:
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          deprecated: true
          description: Legacy server environment variable (not CLOUDPILOT_*) containing the sandbox provider API key;
            optional when apiKey is supplied.
        template:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^\S+$'
          description: Provider template ID or alias with Node.js and Codex installed. CPU and memory are
            configured on the template rather than through Docker runner fields.
        leaseSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 900
          description: Renewable sandbox lease, independent of the pipeline turn timeout. The provider account
            may enforce a lower maximum.
        idleStrategy:
          type: string
          enum:
          - pause
          default: pause
          description: Pause the sandbox between interactive turns and reconnect to the retained workspace on resume.
      required:
      - template
      additionalProperties: false
    Event:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        inputName:
          type: string
        pipelineName:
          type: string
        status:
          type: string
          enum:
          - queued
          - waiting
          - running
          - succeeded
          - failed
          - cancelled
          - interrupted
        payload: {}
        attempts:
          type: integer
          minimum: 0
        availableAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - inputName
      - pipelineName
      - status
      - payload
      - attempts
      - availableAt
      - createdAt
      - updatedAt
    EventDetail:
      type: object
      properties:
        event:
          $ref: '#/components/schemas/Event'
        runs:
          type: array
          items:
            $ref: '#/components/schemas/Run'
          description: All execution attempts for this event, newest first. Empty while awaiting the first run.
      required:
      - event
      - runs
    Run:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        eventId:
          type: integer
          minimum: 1
        pipelineName:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
          - interrupted
        attempt:
          type: integer
          minimum: 1
        workerName:
          type: string
        workspaceName:
          type: string
        runnerName:
          type: string
        error:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - eventId
      - pipelineName
      - status
      - attempt
      - workerName
      - workspaceName
      - runnerName
      - error
      - startedAt
      - finishedAt
      - createdAt
    RunLog:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        runId:
          type: integer
          minimum: 1
        stream:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - runId
      - stream
      - message
      - createdAt
    Artifact:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        runId:
          type: integer
          minimum: 1
        kind:
          type: string
          enum:
          - issue
          - pr
          - file
          - text
        name:
          type: string
        url:
          type: string
        outputPath:
          type: string
          description: File path relative to the worker's /output directory; present for file artifacts.
        content:
          type: string
        contentType:
          type: string
        size:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - runId
      - kind
      - name
      - url
      - content
      - contentType
      - size
      - createdAt
    RunDetail:
      type: object
      properties:
        run:
          $ref: '#/components/schemas/Run'
        event:
          $ref: '#/components/schemas/Event'
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/Artifact'
        session:
          anyOf:
          - $ref: '#/components/schemas/AgentSession'
          - type: 'null'
        capabilities:
          $ref: '#/components/schemas/AgentCapabilities'
        turns:
          type: array
          items:
            $ref: '#/components/schemas/AgentTurn'
          description: Turns ordered by ascending number.
      required:
      - run
      - event
      - artifacts
      - session
      - capabilities
      - turns
    Overview:
      type: object
      properties:
        resources:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        events:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        runs:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
      required:
      - resources
      - events
      - runs
    ImportRequest:
      type: object
      properties:
        yaml:
          type: string
          description: At most 1 MiB of YAML containing up to 100 documents.
      required:
      - yaml
      additionalProperties: false
    Input:
      type: object
      properties:
        apiVersion:
          type: string
          enum:
          - cloudpilot.dev/v1alpha1
        kind:
          type: string
          enum:
          - Input
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/InputSpec'
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      additionalProperties: false
    Pipeline:
      type: object
      properties:
        apiVersion:
          type: string
          enum:
          - cloudpilot.dev/v1alpha1
        kind:
          type: string
          enum:
          - Pipeline
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/PipelineSpec'
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      additionalProperties: false
    Worker:
      type: object
      properties:
        apiVersion:
          type: string
          enum:
          - cloudpilot.dev/v1alpha1
        kind:
          type: string
          enum:
          - Worker
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/WorkerSpec'
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      additionalProperties: false
    Workspace:
      type: object
      properties:
        apiVersion:
          type: string
          enum:
          - cloudpilot.dev/v1alpha1
        kind:
          type: string
          enum:
          - Workspace
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/WorkspaceSpec'
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      additionalProperties: false
    Runner:
      type: object
      properties:
        apiVersion:
          type: string
          enum:
          - cloudpilot.dev/v1alpha1
        kind:
          type: string
          enum:
          - Runner
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/RunnerSpec'
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      additionalProperties: false
    Document:
      oneOf:
      - $ref: '#/components/schemas/Input'
      - $ref: '#/components/schemas/Pipeline'
      - $ref: '#/components/schemas/Worker'
      - $ref: '#/components/schemas/Workspace'
      - $ref: '#/components/schemas/Runner'
      discriminator:
        propertyName: kind
        mapping:
          Input: '#/components/schemas/Input'
          Pipeline: '#/components/schemas/Pipeline'
          Worker: '#/components/schemas/Worker'
          Workspace: '#/components/schemas/Workspace'
          Runner: '#/components/schemas/Runner'
    AgentSession:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        runId:
          type: integer
          minimum: 1
        threadId:
          type: string
        state:
          type: string
          enum:
          - starting
          - queued
          - running
          - interrupting
          - idle
          - interrupted
          - failed
          - closing
          - closed
        currentTurnId:
          type: integer
          minimum: 0
        workspaceLost:
          type: boolean
          description: The retained execution workspace is no longer available. Resuming or sending another turn
            is disabled; close this session before starting a fresh run.
        lastError:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        closedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - runId
      - threadId
      - state
      - currentTurnId
      - workspaceLost
      - lastError
      - createdAt
      - updatedAt
      - closedAt
      description: Agent conversation associated with one Run. The resource configuration snapshot is private. An
        idle session remains resumable after a successful run; only closing it removes its persisted workspace and
        conversation state.
    AgentCapabilities:
      type: object
      properties:
        interactive:
          type: boolean
        canSend:
          type: boolean
        canInterrupt:
          type: boolean
        canResume:
          type: boolean
        canClose:
          type: boolean
      required:
      - interactive
      - canSend
      - canInterrupt
      - canResume
      - canClose
      description: Actions supported by the adapter in the current session state. Capabilities may change before
        a request reaches the server; stale actions return 409.
    AgentTurn:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        runId:
          type: integer
          minimum: 1
        sessionId:
          type: integer
          minimum: 1
        number:
          type: integer
          minimum: 1
        providerTurnId:
          type: string
        input:
          type: string
        initial:
          type: boolean
        userId:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - interrupted
          - failed
        createdAt:
          type: string
          format: date-time
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - runId
      - sessionId
      - number
      - providerTurnId
      - input
      - initial
      - userId
      - status
      - createdAt
      - startedAt
      - finishedAt
      description: One initial or human-requested execution turn in an AgentSession. Initial input contains feedback
        JSON. A userId of zero identifies an automatic initial turn.
    SessionEvent:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        runId:
          type: integer
          minimum: 1
        turnId:
          type: integer
          minimum: 0
        type:
          type: string
          enum:
          - message
          - tool
          - status
          - error
          - control
        itemId:
          type: string
        role:
          type: string
        status:
          type: string
        text:
          type: string
        tool:
          type: string
        command:
          type: string
        output:
          type: string
        delta:
          type: boolean
        controlId:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - runId
      - turnId
      - type
      - itemId
      - role
      - status
      - text
      - tool
      - command
      - output
      - delta
      - controlId
      - createdAt
      description: Append-only normalized timeline event. Group content by turnId and itemId. delta=true appends
        text or tool output; delta=false replaces the current item snapshot. controlId references a queued user-message
        event; control status accepted or rejected reports whether active-turn steering reached the agent. Provider
        secrets are redacted; raw protocol payloads are not exposed.
    AgentMessageRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 32768
          description: Nonblank text, at most 32 KiB encoded as UTF-8. NUL characters are not allowed; the encoded
            JSON request body is limited to 256 KiB.
      required:
      - message
      additionalProperties: false
    AgentResumeRequest:
      type: object
      properties:
        message:
          type: string
          maxLength: 32768
          description: Optional continuation instruction, at most 32 KiB encoded as UTF-8. Empty input uses the
            default continuation instruction. NUL characters are not allowed; the encoded JSON request body is limited
            to 256 KiB.
      additionalProperties: false
    ActionAccepted:
      type: object
      properties:
        message:
          type: string
      required:
      - message
      description: The operation was accepted for processing. Consult session state and timeline events for delivery,
        completion or failure.
