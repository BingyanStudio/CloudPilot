name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - run: node --test deploy/sandbox/build.test.mjs deploy/sandbox-ppio/build.test.mjs
      - run: go mod download
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go test ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build ./cmd/cloudpilot

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
